- name: Mary Long
  date: 2 weeks ago
  text: >
    An honest mechanic and very knowledgeable. I had just bought an older Freightliner and needed an honest inspection. 
    Sheldon came to my location, did a detailed assessment, and showed me areas of concern. He actually charged me LESS 
    than the original estimate — and followed up 10 days later to make sure the truck was performing well. Highly recommend.

- name: Denzil Mclean
  date: 8 months ago
  text: >
    Had a carrier bearing break in Orlando in the middle of the street. AD&M came out and got me moving again. 
    Came back all the way from Virginia to Leesburg for my clutch and pilot bearing. Sheldon goes way above and beyond — 
    his customer service is top notch. He's my new mechanic hands down and deserves more than 5 stars.

- name: Shasta
  date: a year ago
  text: >
    AD&M Mobile Diesel is a very honest and thorough semi mechanic with reasonable prices. The customer service and 
    level of expertise is incomparable — usually out of reach at dealerships. This company has never let me down.

- name: Tianna Payne
  date: 7 months ago
  text: >
    The best customer service and mechanic in the Florida area. He assessed the problem even before coming to the location, 
    picked up the part, and put it on correctly in a timely manner which cut down the cost. Pricing is fair. Highly recommend!

- name: Al Sawyer
  date: 5 months ago
  text: >
    This man literally saved me thousands of dollars. Had my truck in two different shops for the same problem — threw away 
    $4k between them and it still wasn't fixed. Called Sheldon, he came out, charged me $260, and solved the problem.

- name: Crystal Orr
  date: a year ago
  text: >
    After a sizeable oil leak, the first shop wanted a $750 tow plus a $400 diagnostic. Sheldon diagnosed the issue via 
    FaceTime, parts were $520 plus the service call, and I was back on the road. Will DEFINITELY be a returning customer!

- name: Antoine Cruz
  date: 2 years ago
  text: >
    Drive shaft broke off as my driver was pulling out the gate headed to Miami. Called AD&M and he was there with no hesitation, 
    fixed the problem in no time. Very professional and knowledgeable — price was beyond reasonable. Highly recommend!

- name: GAMETIME
  date: a year ago
  text: >
    Best mechanic I've seen yet. Had electrical problems — Loves and TA both told me to take it to the Volvo dealer. 
    Someone referred me to AD&M, I called, and he came and fixed the problem in a few hours. This guy is a blessing.

- name: Juniors Transportation, LLC
  date: 3 years ago
  text: >
    Sheldon replaced my clutch and brakes, found that the previous clutch brake was installed incorrectly causing the problem. 
    Did a great job, was quick, showed me the old parts so I understood the issue. Very knowledgeable — will use him regularly.

- name: John Link
  date: 2 years ago
  text: >
    Sheldon repaired our RV on the side of the road, rescuing us from a bad situation. He communicated the whole time and 
    went out of his way to find the part before arriving. Very competent and professional — definitely worth five stars.

- name: Mark Davies
  date: 9 months ago
  text: >
    Motorhome broke down due to a radiator problem. Sheldon did a great job getting us back on the road. Highly recommend!

- name: Victoria Valencia
  date: 2 years ago
  text: >
    By far the best mobile mechanic we've used. He quickly got my driver back on the road and followed up a week later 
    with excellent guidance on any additional questions. Highly recommend.

- name: Winston Casserly
  date: 3 years ago
  text: >
    My Detroit 60 Series 14L was rebuilt by Sheldon and I am completely satisfied. The level of communication throughout 
    the rebuild was excellent. No hesitation in recommending this company to anyone in need of diesel repair.

- name: Ronda Munsell
  date: 2 years ago
  text: >
    Sheldon was amazing — handled my crankshaft, differential hoses, ABS air bags, wiring, and more. And when a payment 
    went through twice by mistake, he returned the $1000 immediately. Honesty is hard to find and I praise God for companies like his.

- name: Jamie Mister
  date: 3 years ago
  text: >
    Fast and efficient service. Professional, friendly, and knowledgeable with fair pricing. Thorough evaluation and repair 
    got us back on the road quickly. We need more honest mechanics — highly recommend this business.
