<style>
    :root {
        --brand-red: #d33121;
        --dark-bg: #0a0a0a;
        --card-bg: #1a1a1a;
        --text-light: #f4f4f4;
        --chrome: linear-gradient(180deg, #ffffff 0%, #a1a1a1 50%, #ffffff 100%);
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--dark-bg);
        color: var(--text-light);
        line-height: 1.6;
    }

    .container { width: 90%; max-width: 1200px; margin: auto; }

    /* Navigation */
    .navbar { background: rgba(0,0,0,0.9); padding: 10px 0; border-bottom: 2px solid var(--brand-red); position: sticky; top: 0; z-index: 100; }
    .nav-logo { height: 60px; }
    .nav-contact { float: right; }

    /* Hero Section */
    .hero { 
        height: 80vh; 
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('truck-bg.jpg') center/cover; 
        display: flex; align-items: center; justify-content: center; text-align: center;
        border-bottom: 5px solid var(--brand-red);
    }
    .hero h1 { font-size: 4rem; text-transform: uppercase; margin-bottom: 10px; background: var(--chrome); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.5)); }

    /* Buttons */
    .cta-button { background: var(--brand-red); color: white; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; text-transform: uppercase; transition: 0.3s; display: inline-block; }
    .cta-button:hover { background: white; color: var(--brand-red); }
    
    .pulse { animation: pulse-red 2s infinite; }
    @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(211, 49, 33, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(211, 49, 33, 0); } 100% { box-shadow: 0 0 0 0 rgba(211, 49, 33, 0); } }

    /* Review & Gallery Arrays */
    .scroll-container { display: flex; overflow-x: auto; gap: 20px; padding: 20px 0; scrollbar-width: thin; }
    .review-card { min-width: 300px; background: var(--card-bg); padding: 20px; border-left: 4px solid var(--brand-red); border-radius: 8px; }
    .star-rating { color: #f1c40f; margin-bottom: 10px; }

    .video-card { min-width: 280px; height: 500px; background: #000; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #333; }
    .gallery-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; border: 2px solid #333; }

    /* Form */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 50px 0; }
    form { background: var(--card-bg); padding: 30px; border-radius: 10px; }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 4px; }

    footer { text-align: center; padding: 50px 0; background: #000; border-top: 1px solid #222; }
    
    @media (max-width: 768px) {
        .hero h1 { font-size: 2.5rem; }
        .contact-grid { grid-template-columns: 1fr; }
    }
</style>
